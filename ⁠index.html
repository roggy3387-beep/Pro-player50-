<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reak - Free Fire Proxy VIP</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            width: 100%;
            max-width: 420px;
            background: #11131a;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .app-header { text-align: center; margin-bottom: 16px; }
        .app-icon {
            width: 65px; height: 65px; border-radius: 16px; margin-bottom: 6px;
            object-fit: cover;
            border: 1.5px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        .app-title { font-size: 18px; font-weight: bold; margin: 0; color: #fff; }
        .app-sub { font-size: 11px; color: #8b9bb4; margin-top: 2px; }
        .menu-box {
            background: rgba(22, 26, 38, 0.7);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .menu-title-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .menu-title { color: #00f2fe; font-size: 13px; font-weight: bold; }
        .auto-badge {
            background: rgba(0, 255, 100, 0.15); color: #00ff66;
            font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 6px;
        }
        .item-row {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.02); border-radius: 12px;
            padding: 8px 10px; margin-bottom: 8px;
        }
        .item-left { display: flex; align-items: center; gap: 10px; }
        .item-icon {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
        }
        .icon-red { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .icon-orange { background: linear-gradient(135deg, #f7971e, #ffd200); }
        .icon-pink { background: linear-gradient(135deg, #eb3349, #f45c43); }
        .icon-blue { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .item-text h4 { margin: 0; font-size: 13px; color: #fff; }
        .item-text p { margin: 2px 0 0 0; font-size: 10px; color: #8b9bb4; }
        .switch {
            position: relative; display: inline-block; width: 40px; height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2b3142; transition: .3s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #ff3366; }
        input:checked + .slider:before { transform: translateX(18px); }
        .status-text { text-align: center; font-size: 11px; color: #8b9bb4; margin: 10px 0; }
        .btn-open {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #8a2be2, #00bfff);
            border: none; border-radius: 14px; color: white; font-weight: bold;
            font-size: 14px; cursor: pointer; text-align: center;
            text-decoration: none; display: block;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="app-header">
            <img src="image.png" class="app-icon" alt="User Icon">
            <div class="app-title">Free Fire (Reak VIP)</div>
            <div class="app-sub">com.dts.freefireth</div>
        </div>
        <div class="menu-box">
            <div class="menu-title-bar">
                <span class="menu-title">⚡ PROXY REAK VIP</span>
                <span class="auto-badge">AUTO</span>
            </div>
            <div class="item-row">
                <div class="item-left">
                    <div class="item-icon icon-red">👤</div>
                    <div class="item-text">
                        <h4>Proxy Body</h4>
                        <p>Full Skin & Yellow HP Bar</p>
                    </div>
                </div>
                <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
            </div>
            <div class="item-row">
                <div class="item-left">
                    <div class="item-icon icon-orange">🎯</div>
                    <div class="item-text">
                        <h4>Proxy Neck V1</h4>
                        <p>Aim Neck Legit Version</p>
                    </div>
                </div>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="item-row">
                <div class="item-left">
                    <div class="item-icon icon-pink">🎯</div>
                    <div class="item-text">
                        <h4>Proxy Neck V2</h4>
                        <p>Larger Red Neck Hitbox</p>
                    </div>
                </div>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
            <div class="item-row">
                <div class="item-left">
                    <div class="item-icon icon-blue">👆</div>
                    <div class="item-text">
                        <h4>Proxy Drag</h4>
                        <p>Smooth Aim Assist to Head</p>
                    </div>
                </div>
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
            </div>
        </div>
        <div class="status-text">⏳ Status: Active</div>
        
        <!-- លីងបើកចូលហ្គេម Free Fire ធម្មតា -->
        <a href="freefire://" class="btn-open">▶ OPEN GAME</a>
    </div>
</body>
</html>
